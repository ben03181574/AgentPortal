version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: agentportal-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: agentportal-grafana
    ports:
      - "3001:3000"