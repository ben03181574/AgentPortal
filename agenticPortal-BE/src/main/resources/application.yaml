spring:
  application:
    name: agenticPortal

  reactor:
    context-propagation: auto

  datasource:
    url: jdbc:mariadb://localhost:3307/agentportal
    username: root
    password: rootpwd
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  neo4j:
    uri: bolt://localhost:17687
    authentication:
      username: neo4j
      password: neo4jpwd

ollama:
  base-url: http://localhost:11434
  chat-model-name: gpt-oss:20b # qwen3:32b / gpt-oss:20b
  embedding-model-name: qwen3-embedding:8b

chroma:
  base-url: http://localhost:8000
  tenant-name: default_tenant
  database-name: default_database
  collection-name: default_collection

agentportal:
  checkpoint:
    type: mariadb
    mariadb:
      create-option: CREATE_IF_NOT_EXISTS
    redis:
      host: localhost
      port: 6379
      database: 0
      ttl: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    baggage:
      correlation:
        enabled: true

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
